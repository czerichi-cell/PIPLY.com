{% extends "base.html" %}
{% block title %}Zapomenuté heslo – Piply{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <img class="auth-logo" src="{{ url_for('static', filename='img/piply-white-transparent-cropped.png') }}" alt="Piply">
  <div class="auth-title">Zapomenuté heslo</div>
  <div class="auth-sub">Zadej e-mail, na kterém máš účet vedený, a pošleme ti odkaz na obnovení hesla.</div>

  <form method="post">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autofocus required>
    </div>
    <button type="submit" class="btn btn-block">Poslat odkaz na obnovení</button>
  </form>

  <div class="auth-foot"><a href="{{ url_for('auth.login') }}">← Zpět na přihlášení</a></div>
</div>
{% endblock %}
