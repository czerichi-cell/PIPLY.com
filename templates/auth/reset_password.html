{% extends "base.html" %}
{% block title %}Nové heslo – Piply{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <img class="auth-logo" src="{{ url_for('static', filename='img/piply-white-transparent-cropped.png') }}" alt="Piply">
  <div class="auth-title">Nastav si nové heslo</div>

  <form method="post">
    <div class="field">
      <label for="password">Nové heslo</label>
      <input type="password" id="password" name="password" autofocus required minlength="6">
    </div>
    <div class="field">
      <label for="password2">Nové heslo znovu</label>
      <input type="password" id="password2" name="password2" required minlength="6">
    </div>
    <button type="submit" class="btn btn-block">Uložit nové heslo</button>
  </form>
</div>
{% endblock %}
